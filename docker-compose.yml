services:
  app:
    build:
      context: .
      network: host # npm's postinstall (Caddy download) can blackhole on Docker's default bridge MTU on some hosts
    ports:
      - "8080:80" # Caddy, HTTP
      - "8443:443" # Caddy, HTTPS (local self-signed cert for "localhost")
      - "2525:25" # SMTP
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - build:/app/build
      - data:/app/data
      - caddy:/root/.local/share/caddy # local CA + certs, kept across restarts

volumes:
  node_modules:
  build:
  data:
  caddy:
